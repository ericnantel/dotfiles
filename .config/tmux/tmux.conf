
# TODO: Fix this if possible..
# if you comment the Tc option then Vim renders properly but not Neovim (in Tmux)
# if you uncomment the Tc option then Neovim render properly but not Vim (in Tmux)
# NOTE: As of now, I've decided to only use 256 colors in Vim.
set -g @colorize_enable off

if -F '#{m:*/dev/pts*,#{TTY}}' {
	set -g @colorize_enable on
} {
}
if -F '#{m:*/dev/ttys*,#{TTY}}' {
	set -g @colorize_enable on
} {
}

if -F '#{@colorize_enable}' {
	set -g @colorize_enable on
	set -g default-terminal "xterm-256color"
	set-option -sa terminal-overrides ",xterm*:Tc"
	# display 'pseudo-terminal or macos ttys'
} {
	# display 'tty'
}

# TODO: we have two options to show sessions
# If tms is available we shall use the one with tms
set-option -g status "on"
set-option -g status-interval 5
set-option -g status-justify "centre"
set-option -g status-position top
set-option -g status-style fg=#3e8fb0,bg=#232136
set-option -g status-left ""
set-option -g status-left-length "80"
set-window-option -g window-status-activity-style fg=#232136,bg=#ea9a97
# set-window-option -g window-status-current-style fg=#f6c177,bg=#232136,bold
# set-window-option -g window-status-style fg=#c4a7e7,bg=#232136
set-window-option -g window-status-current-style fg=#232136,bg=#f6c177,bold
set-window-option -g window-status-style fg=#232136,bg=#c4a7e7
set-window-option -g window-status-separator ""
# set-window-option -g window-status-current-format "#I:#W* "
# set-window-option -g window-status-format "#I:#W  "
set-window-option -g window-status-current-format " #I: #W* "
set-window-option -g window-status-format " #I: #W  "
# set-option -g status-right "#[fg=#232136,bg=#ea9a97] #(tms sessions)"
# set-option -g status-right "#[fg=#232136,bg=#ea9a97] #(tmux list-sessions -F '##S##{?session_attached,*, }' | tr '\n' ' ')"
set-option -g status-right "#[fg=#232136,bg=#ea9a97] #(tmux list-sessions -F '##{session_name}##{?session_attached,*, }' | tr '\n' ' ')"
set-option -g status-right-length "80"
set-option -g pane-border-style fg=#56526e
set-option -g pane-active-border-style fg=#f6c177
set-option -g message-style fg=#6e6a86,bg=#232136,fill=#232136
set-option -g message-command-style fg=#232136,fg=#f6c177,fill=#f6c177
set-option -g display-panes-active-colour "#e0def4"
set-option -g display-panes-colour "#f6c177"

set -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# note see if it conflicts with vim increment command
# note what about using alt ?
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind v split-window -h

unbind '"'
bind h split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# start numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# prefix-x to kill a pane
# prefix-c to create a new window
# prefix-n to switch to next window
# prefix-number to switch to a window using an index
# prefix-w to show all windows

# resize panes
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# maximize pane
bind -r m resize-pane -Z

set -g mouse on

# prefix-b to enter copy mode or Ctl-c to exit copy mode
bind 'b' copy-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

